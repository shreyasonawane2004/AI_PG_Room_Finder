{% extends 'base.html' %}

{% block title %}Create Account | AI-Powered PG & Room Finder{% endblock %}

{% block content %}
<div class="container section" style="min-height: 80vh; display: flex; align-items: center; justify-content: center;">
    <div class="glass-panel" style="max-width: 540px; width: 100%; padding: 2.5rem; border-radius: var(--radius-lg);">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="brand-icon" style="margin: 0 auto 1rem; width: 48px; height: 48px; font-size: 1.4rem;">
                <i class="fas fa-user-plus"></i>
            </div>
            <h1 style="font-size: 1.75rem; margin-bottom: 0.4rem;">Join RoomFinder AI</h1>
            <p style="font-size: 0.9rem;">Create your free account to find or list premium accommodations.</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}" id="register-form">
            <!-- Role Selection -->
            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label class="form-label">I want to:</label>
                <div class="option-cards-grid" style="grid-template-columns: 1fr 1fr;">
                    <label class="option-card-label" id="role-tenant-label">
                        <input type="radio" name="role" value="tenant" {% if request.args.get('role') != 'owner' %}checked{% endif %}>
                        <i class="fas fa-bed" style="font-size: 1.25rem; color: var(--accent);"></i>
                        <span style="font-weight: 700; font-size: 0.95rem;">Find a PG / Room</span>
                        <span style="font-size: 0.75rem; color: var(--text-muted);">As a Tenant / Student</span>
                    </label>

                    <label class="option-card-label" id="role-owner-label">
                        <input type="radio" name="role" value="owner" {% if request.args.get('role') == 'owner' %}checked{% endif %}>
                        <i class="fas fa-building" style="font-size: 1.25rem; color: var(--warning);"></i>
                        <span style="font-weight: 700; font-size: 0.95rem;">List My PG</span>
                        <span style="font-size: 0.75rem; color: var(--text-muted);">As Property Owner</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="full_name" class="form-label">Full Name</label>
                <input type="text" name="full_name" id="full_name" class="form-control" placeholder="John Doe" required autofocus>
            </div>

            <div class="grid-2" style="gap: 1rem;">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" name="email" id="email" class="form-control" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label for="phone" class="form-label">Phone Number</label>
                    <input type="tel" name="phone" id="phone" class="form-control" placeholder="+91 9876543210" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Create Password</label>
                <input type="password" name="password" id="password" class="form-control" placeholder="At least 6 characters" minlength="6" required>
            </div>

            <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1rem;" id="register-submit-btn">
                <i class="fas fa-sparkles"></i> Create Free Account
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem;">
            Already have an account? <a href="{{ url_for('auth.login') }}" style="font-weight: 600;">Sign In here</a>
        </div>
    </div>
</div>
{% endblock %}
